# Build the Kali template (VM {{ kali_template_id }}) from the official image, if it does not exist.
# Needs LAB-GW (proxy). Takes 30-60 minutes.
- name: Kali template
  hosts: pve
  vars:
    kali_template_id: 100
  tasks:
    - name: Copy scripts
      ansible.builtin.import_tasks: tasks/sync.yml
    - name: Template exists?
      ansible.builtin.command: qm status {{ kali_template_id }}
      register: tmpl
      failed_when: false
      changed_when: false
    - name: Build template
      ansible.builtin.command: sh {{ lab_dir }}/kali/build-template.sh {{ kali_template_id }}
      when: tmpl.rc != 0
      async: 7200
      poll: 60
