# Guacamole in CT 111: Docker via the LAB-GW proxy, compose stack, user-mapping.xml
- name: Guacamole - Docker
  ansible.builtin.shell: |
    pct exec 111 -- sh -c '
      command -v docker-compose >/dev/null && exit 0
      echo "Acquire::http::Proxy \"http://10.20.0.1:3128\";" > /etc/apt/apt.conf.d/95proxy
      systemctl disable --now ssh ssh.socket >/dev/null 2>&1 || true
      apt-get -qq update && DEBIAN_FRONTEND=noninteractive apt-get -y -qq install docker.io docker-compose >/dev/null
      mkdir -p /etc/systemd/system/docker.service.d
      printf "[Service]\nEnvironment=HTTP_PROXY=http://10.20.0.1:3128 HTTPS_PROXY=http://10.20.0.1:3128\n" > /etc/systemd/system/docker.service.d/proxy.conf
      systemctl daemon-reload && systemctl restart docker && echo INSTALLED'
  register: docker
  changed_when: "'INSTALLED' in docker.stdout"

- name: Guacamole - files
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/root/guac-{{ item.name }}"
    mode: "0600"
  loop:
    - { src: "{{ infra }}/guacamole/docker-compose.yml", name: compose }
    - { src: "{{ secrets }}/guacamole-home/user-mapping.xml", name: users }
  register: guac_files

- name: Guacamole - start
  ansible.builtin.shell: |
    pct exec 111 -- mkdir -p /opt/guacamole/home
    pct exec 111 -- chmod 700 /opt/guacamole
    pct push 111 /root/guac-compose /opt/guacamole/docker-compose.yml
    pct push 111 /root/guac-users /opt/guacamole/home/user-mapping.xml --perms 0644
    pct exec 111 -- sh -c 'cd /opt/guacamole && docker-compose up -d --quiet-pull 2>&1 | tail -2'
  changed_when: guac_files.changed
