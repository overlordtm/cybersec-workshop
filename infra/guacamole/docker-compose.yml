# Guacamole for browser access to the Kali desktops. Runs in CT 111 (10.20.0.10).
# TLS terminates in Caddy on LAB-GW, which proxies to port 8080.
services:
  guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped

  guacamole:
    image: guacamole/guacamole:1.6.0
    restart: unless-stopped
    depends_on: [guacd]
    environment:
      GUACD_HOSTNAME: guacd
      GUACAMOLE_HOME: /etc/guacamole-template
      WEBAPP_CONTEXT: ROOT
      REMOTE_IP_VALVE_ENABLED: "true"
      PROXY_ALLOWED_IPS_REGEX: '10\.20\.0\.1'
    volumes:
      - ./home:/etc/guacamole-template:ro
    ports:
      - "8080:8080"
