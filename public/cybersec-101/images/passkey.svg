<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 405" role="img" aria-labelledby="title desc"><title id="title">Ključ za dostop je vezan na pravo spletno mesto</title><desc id="desc">Naprava preveri uporabnika s PIN-om ali biometrijo in dokaže posedovanje ključa pravemu spletnemu mestu; lažna domena ne ustreza.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#38bdf8"/></marker></defs><rect width="1200" height="405" rx="20" fill="#0b1220"/><g font-family="Arial, sans-serif"><text x="32" y="44" font-size="28" fill="#38bdf8">Ključ za dostop je vezan na pravo spletno mesto</text><rect x="32" y="88" width="400" height="270" rx="16" fill="#17243a" stroke="#38bdf8" stroke-width="2"/><text x="58" y="135" font-size="28" fill="#38bdf8">TVOJA NAPRAVA</text><text x="58" y="185" font-size="26" fill="#e2e8f0">Odklep: PIN ali biometrija</text><text x="58" y="230" font-size="26" fill="#e2e8f0">Zasebni ključ v napravi</text><text x="58" y="267" font-size="24" fill="#e2e8f0">ali upravljalniku ključev</text><text x="58" y="315" font-size="23" fill="#4ade80">Biometrija ostane lokalna.</text><path d="M458 202 L674 202" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/><text x="470" y="158" font-size="22" fill="#e2e8f0">dokaz prijave</text><rect x="700" y="88" width="468" height="125" rx="16" fill="#17243a" stroke="#4ade80" stroke-width="2"/><text x="726" y="133" font-size="27" fill="#4ade80">prava-stran.example</text><text x="726" y="176" font-size="24" fill="#e2e8f0">Javni ključ preveri dokaz.</text><rect x="700" y="237" width="468" height="121" rx="16" fill="#17243a" stroke="#fb7185" stroke-width="2"/><text x="726" y="280" font-size="27" fill="#fb7185">lazna-stran.example</text><text x="726" y="322" font-size="22" fill="#e2e8f0">Druga domena → ključ ne ustreza.</text></g></svg>

