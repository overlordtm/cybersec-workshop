<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 405" role="img" aria-labelledby="title desc"><title id="title">Kje bi ustavil takšno sporočilo?</title><desc id="desc">Izmišljena e-pošta banke z označenimi pošiljateljem, pritiskom in lažno domeno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#38bdf8"/></marker></defs><rect width="1200" height="405" rx="20" fill="#0b1220"/><g font-family="Arial, sans-serif"><text x="32" y="44" font-size="28" fill="#38bdf8">Kje bi ustavil takšno sporočilo?</text><rect x="32" y="65" width="720" height="318" rx="16" fill="#17243a" stroke="#38bdf8" stroke-width="2"/><text x="56" y="105" font-size="24" fill="#e2e8f0">Od: Moja banka &lt;podpora@racun-pomoc.example&gt;</text><text x="56" y="150" font-size="26" fill="#e2e8f0">Zadeva: Vaš račun bo danes omejen</text><text x="56" y="202" font-size="26" fill="#e2e8f0">Spoštovani, zaradi varnostnega pregleda</text><text x="56" y="240" font-size="26" fill="#e2e8f0">v 30 minutah potrdite geslo in SMS-kodo.</text><rect x="56" y="270" width="620" height="50" rx="16" fill="#17243a" stroke="#fb7185" stroke-width="2"/><text x="72" y="303" font-size="24" fill="#fb7185">banka.example.prijava-pomoc.example</text><text x="792" y="110" font-size="27" fill="#fbbf24">1  Ime ≠ naslov</text><text x="792" y="195" font-size="27" fill="#fbbf24">2  Pritisk in skrivnosti</text><text x="792" y="295" font-size="27" fill="#fbbf24">3  Preveri domeno</text><text x="792" y="355" font-size="20" fill="#94a3b8">IZMIŠLJEN PRIMER</text></g></svg>

