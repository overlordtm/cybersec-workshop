<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 405" role="img" aria-labelledby="title desc"><title id="title">Ista prevara, drugačen kanal</title><desc id="desc">Izmišljeno SMS-sporočilo o pošiljki in telefonski klic lažnega bančnega uslužbenca.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#38bdf8"/></marker></defs><rect width="1200" height="405" rx="20" fill="#0b1220"/><g font-family="Arial, sans-serif"><text x="32" y="44" font-size="28" fill="#38bdf8">Ista prevara, drugačen kanal</text><rect x="32" y="74" width="540" height="305" rx="16" fill="#17243a" stroke="#38bdf8" stroke-width="2"/><text x="58" y="115" font-size="26" fill="#38bdf8">SMS · Dostava</text><text x="58" y="164" font-size="26" fill="#e2e8f0">Paket čaka. Doplačilo: 1,99 €.</text><text x="58" y="203" font-size="26" fill="#e2e8f0">Plačajte še danes:</text><text x="58" y="248" font-size="26" fill="#fb7185">dostava-placilo.example</text><text x="58" y="334" font-size="23" fill="#fbbf24">Majhen znesek → podatki kartice</text><rect x="622" y="74" width="546" height="305" rx="16" fill="#17243a" stroke="#38bdf8" stroke-width="2"/><text x="648" y="115" font-size="26" fill="#38bdf8">KLIC · »Varnostna služba«</text><text x="648" y="164" font-size="26" fill="#e2e8f0">Vaš denar je ogrožen.</text><text x="648" y="203" font-size="26" fill="#e2e8f0">Prenesite ga na »varen račun«.</text><text x="648" y="248" font-size="24" fill="#fb7185">Povejte mi še potrditveno kodo.</text><text x="648" y="334" font-size="23" fill="#fbbf24">Prekini → sam pokliči banko</text></g></svg>

