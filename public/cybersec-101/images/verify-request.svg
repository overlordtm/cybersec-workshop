<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 405" role="img" aria-labelledby="title desc"><title id="title">Ustavi se → preveri → ukrepaj</title><desc id="desc">Trije koraki: ustavi pritisk, preveri prek znane številke in ukrepaj po preverjanju.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#38bdf8"/></marker></defs><rect width="1200" height="405" rx="20" fill="#0b1220"/><g font-family="Arial, sans-serif"><text x="32" y="44" font-size="28" fill="#38bdf8">Ustavi se → preveri → ukrepaj</text><rect x="32" y="120" width="330" height="160" rx="16" fill="#17243a" stroke="#38bdf8" stroke-width="2"/><text x="58" y="170" font-size="30" fill="#fbbf24">1  USTAVI SE</text><text x="58" y="220" font-size="25" fill="#e2e8f0">Ne deli kod ali gesel.</text><path d="M380 200 L430 200" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/><rect x="450" y="120" width="330" height="160" rx="16" fill="#17243a" stroke="#38bdf8" stroke-width="2"/><text x="476" y="170" font-size="30" fill="#38bdf8">2  PREVERI</text><text x="476" y="220" font-size="24" fill="#e2e8f0">Pokliči znano številko.</text><path d="M798 200 L848 200" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/><rect x="870" y="120" width="298" height="160" rx="16" fill="#17243a" stroke="#38bdf8" stroke-width="2"/><text x="896" y="170" font-size="30" fill="#4ade80">3  UKREPAJ</text><text x="896" y="220" font-size="25" fill="#e2e8f0">Potrdi ali prijavi.</text><text x="32" y="349" font-size="24" fill="#e2e8f0">Kontakt poišči v aplikaciji, imeniku ali na uradni strani; ne v prejetem sporočilu.</text></g></svg>

