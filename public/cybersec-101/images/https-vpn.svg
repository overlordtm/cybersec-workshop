<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 405" role="img" aria-labelledby="title desc"><title id="title">HTTPS in VPN varujeta različna odseka</title><desc id="desc">HTTPS šifrira vsebino od brskalnika do spletne strani. VPN šifrira predor do ponudnika VPN. Izbira ponudnika pomeni odločitev o zaupanju.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#38bdf8"/></marker></defs><rect width="1200" height="405" rx="20" fill="#0b1220"/><g font-family="Arial, sans-serif"><text x="32" y="44" font-size="28" fill="#38bdf8">HTTPS in VPN varujeta različna odseka</text><text x="32" y="104" font-size="27" fill="#4ade80">HTTPS</text><rect x="32" y="135" width="260" height="88" rx="16" fill="#17243a" stroke="#38bdf8" stroke-width="2"/><text x="57" y="189" font-size="27" fill="#e2e8f0">Tvoja naprava</text><rect x="470" y="135" width="260" height="88" rx="16" fill="#17243a" stroke="#38bdf8" stroke-width="2"/><text x="495" y="189" font-size="25" fill="#e2e8f0">Lokalno omrežje</text><rect x="908" y="135" width="260" height="88" rx="16" fill="#17243a" stroke="#38bdf8" stroke-width="2"/><text x="934" y="189" font-size="27" fill="#e2e8f0">Spletna stran</text><path d="M312 180 L448 180" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/><path d="M748 180 L886 180" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/><text x="310" y="116" font-size="24" fill="#4ade80">šifrirana vsebina do spletne strani</text><text x="32" y="279" font-size="27" fill="#38bdf8">VPN</text><rect x="32" y="305" width="260" height="72" rx="16" fill="#17243a" stroke="#38bdf8" stroke-width="2"/><text x="57" y="350" font-size="26" fill="#e2e8f0">Tvoja naprava</text><rect x="470" y="305" width="260" height="72" rx="16" fill="#17243a" stroke="#38bdf8" stroke-width="2"/><text x="495" y="350" font-size="26" fill="#e2e8f0">Ponudnik VPN</text><rect x="908" y="305" width="260" height="72" rx="16" fill="#17243a" stroke="#38bdf8" stroke-width="2"/><text x="934" y="350" font-size="26" fill="#e2e8f0">Spletna stran</text><path d="M312 340 L448 340" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/><path d="M748 340 L886 340" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/><text x="312" y="286" font-size="23" fill="#38bdf8">šifriran predor</text><text x="750" y="286" font-size="20" fill="#4ade80">HTTPS še vedno šteje</text></g></svg>

