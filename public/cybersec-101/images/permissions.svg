<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 405" role="img" aria-labelledby="title desc"><title id="title">Dovoljenje naj sledi namenu aplikacije</title><desc id="desc">Trije izmišljeni primeri: zemljevidu lokacija med uporabo, videoklicu mikrofon med uporabo, svetilki zavrnjen dostop do stikov.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#38bdf8"/></marker></defs><rect width="1200" height="405" rx="20" fill="#0b1220"/><g font-family="Arial, sans-serif"><text x="32" y="44" font-size="28" fill="#38bdf8">Dovoljenje naj sledi namenu aplikacije</text><rect x="32" y="100" width="352" height="250" rx="16" fill="#17243a" stroke="#38bdf8" stroke-width="2"/><text x="58" y="146" font-size="28" fill="#38bdf8">ZEMLJEVID</text><text x="58" y="201" font-size="26" fill="#e2e8f0">Lokacija</text><text x="58" y="245" font-size="27" fill="#4ade80">Med uporabo</text><text x="58" y="306" font-size="22" fill="#e2e8f0">Natančna, če jo potrebuje.</text><rect x="424" y="100" width="352" height="250" rx="16" fill="#17243a" stroke="#38bdf8" stroke-width="2"/><text x="450" y="146" font-size="28" fill="#38bdf8">VIDEOKLIC</text><text x="450" y="201" font-size="26" fill="#e2e8f0">Mikrofon</text><text x="450" y="245" font-size="27" fill="#4ade80">Med uporabo</text><text x="450" y="306" font-size="23" fill="#e2e8f0">Preizkusi delovanje.</text><rect x="816" y="100" width="352" height="250" rx="16" fill="#17243a" stroke="#38bdf8" stroke-width="2"/><text x="842" y="146" font-size="28" fill="#38bdf8">SVETILKA</text><text x="842" y="201" font-size="26" fill="#e2e8f0">Stiki</text><text x="842" y="245" font-size="27" fill="#fb7185">Zavrni</text><text x="842" y="306" font-size="22" fill="#e2e8f0">Zakaj bi jih potrebovala?</text></g></svg>

