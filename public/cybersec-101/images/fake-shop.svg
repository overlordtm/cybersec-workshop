<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 405" role="img" aria-labelledby="title desc"><title id="title">Lepa trgovina še ni preverjen trgovec</title><desc id="desc">Izmišljena trgovina s prevelikim popustom, manjkajočimi podatki in plačilom prek nakazila.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#38bdf8"/></marker></defs><rect width="1200" height="405" rx="20" fill="#0b1220"/><g font-family="Arial, sans-serif"><text x="32" y="44" font-size="28" fill="#38bdf8">Lepa trgovina še ni preverjen trgovec</text><rect x="32" y="68" width="1136" height="308" rx="16" fill="#17243a" stroke="#38bdf8" stroke-width="2"/><text x="56" y="107" font-size="24" fill="#94a3b8">HTTPS   |   super-popusti.example</text><text x="56" y="159" font-size="34" fill="#e2e8f0">SUPER PONUDBA · SAMO ŠE DANES</text><text x="56" y="217" font-size="32" fill="#fbbf24">Slušalke: 39 €   /   prej 249 €</text><text x="56" y="267" font-size="26" fill="#e2e8f0">Kontakt: samo obrazec. Podatkov podjetja ni.</text><text x="56" y="313" font-size="26" fill="#e2e8f0">Plačilo: samo nakazilo. »Kupci«: samo pohvale.</text><text x="56" y="353" font-size="22" fill="#38bdf8">HTTPS šifrira povezavo; preveri tudi trgovca.</text></g></svg>

