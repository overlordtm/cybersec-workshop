<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 405" role="img" aria-labelledby="title desc"><title id="title">Dve ločeni vprašanji o DNS</title><desc id="desc">Šifriranje DNS varuje prenos poizvedbe do ponudnika. Filtriranje DNS lahko blokira znane zlonamerne domene. Oboje ima omejitve.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#38bdf8"/></marker></defs><rect width="1200" height="405" rx="20" fill="#0b1220"/><g font-family="Arial, sans-serif"><text x="32" y="44" font-size="28" fill="#38bdf8">Dve ločeni vprašanji o DNS</text><rect x="32" y="80" width="548" height="286" rx="16" fill="#17243a" stroke="#38bdf8" stroke-width="2"/><text x="58" y="129" font-size="26" fill="#38bdf8">1  KAKO POTUJE POIZVEDBA?</text><text x="58" y="190" font-size="26" fill="#e2e8f0">Običajni DNS: nešifrirano</text><text x="58" y="240" font-size="26" fill="#e2e8f0">DoH / DoT: šifrirano</text><text x="58" y="313" font-size="23" fill="#94a3b8">Ponudnik DNS vidi poizvedbo.</text><rect x="618" y="80" width="550" height="286" rx="16" fill="#17243a" stroke="#38bdf8" stroke-width="2"/><text x="644" y="129" font-size="26" fill="#4ade80">2  KAJ PONUDNIK BLOKIRA?</text><text x="644" y="190" font-size="24" fill="#e2e8f0">Quad9: znane nevarne domene</text><text x="644" y="240" font-size="24" fill="#e2e8f0">Cloudflare 1.1.1.2: filtriranje</text><text x="644" y="280" font-size="24" fill="#e2e8f0">Cloudflare 1.1.1.1: brez filtra</text><text x="644" y="330" font-size="23" fill="#94a3b8">Filtri ne poznajo vseh prevar.</text></g></svg>

