<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 405" role="img" aria-labelledby="title desc"><title id="title">Eno razkrito geslo lahko odpre več računov</title><desc id="desc">Razkritje gesla v trgovini vodi v poskuse prijave v pošto in druge račune; edinstvena gesla prekinejo verigo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#38bdf8"/></marker></defs><rect width="1200" height="405" rx="20" fill="#0b1220"/><g font-family="Arial, sans-serif"><text x="32" y="44" font-size="28" fill="#38bdf8">Eno razkrito geslo lahko odpre več računov</text><rect x="32" y="100" width="310" height="230" rx="16" fill="#17243a" stroke="#fb7185" stroke-width="2"/><text x="56" y="150" font-size="24" fill="#fb7185">RAZKRITA TRGOVINA</text><text x="56" y="202" font-size="26" fill="#e2e8f0">E-poštni naslov</text><text x="56" y="244" font-size="26" fill="#e2e8f0">+ ponovno uporabljeno</text><text x="56" y="282" font-size="26" fill="#e2e8f0">geslo</text><path d="M364 215 L449 215" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/><rect x="470" y="100" width="310" height="230" rx="16" fill="#17243a" stroke="#38bdf8" stroke-width="2"/><text x="496" y="150" font-size="24" fill="#fbbf24">PREIZKUS ISTEGA</text><text x="496" y="202" font-size="26" fill="#e2e8f0">Pošta</text><text x="496" y="244" font-size="26" fill="#e2e8f0">Družbena omrežja</text><text x="496" y="282" font-size="26" fill="#e2e8f0">Druga trgovina</text><path d="M804 215 L864 215" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/><rect x="884" y="100" width="284" height="230" rx="16" fill="#17243a" stroke="#4ade80" stroke-width="2"/><text x="908" y="150" font-size="23" fill="#4ade80">PREKINI VERIGO</text><text x="908" y="202" font-size="26" fill="#e2e8f0">Za vsak račun</text><text x="908" y="244" font-size="26" fill="#e2e8f0">drugo geslo</text><text x="908" y="282" font-size="23" fill="#e2e8f0">+ dodatna prijava</text></g></svg>

