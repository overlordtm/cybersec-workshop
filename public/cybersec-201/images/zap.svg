<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
<title id="title">ZAP med brskalnikom in aplikacijo</title><desc id="desc">ZAP zabeleži zahtevo, omogoči spremembo enega podatka in ponovitev ter prikaže odgovor aplikacije.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#38bdf8"/></marker></defs>
<rect width="960" height="320" rx="22" fill="#101e32"/>
<g font-family="system-ui,sans-serif" text-anchor="middle"><g fill="#182b43" stroke-width="2"><rect x="30" y="80" width="230" height="140" rx="14" stroke="#7dd3fc"/><rect x="365" y="80" width="230" height="140" rx="14" stroke="#fcd34d"/><rect x="700" y="80" width="230" height="140" rx="14" stroke="#6ee7b7"/></g>
<g font-size="26" font-weight="650"><text x="145" y="137" fill="#7dd3fc">Brskalnik</text><text x="480" y="137" fill="#fcd34d">ZAP</text><text x="815" y="137" fill="#6ee7b7">Aplikacija</text></g>
<g fill="#cbd5e1" font-size="19"><text x="145" y="176">Uporabnikovo dejanje</text><text x="480" y="176">Ogled · sprememba</text><text x="815" y="176">Obdelava podatkov</text><text x="480" y="280">Ponovimo zahtevo in primerjamo vsebino odgovora.</text></g></g>
<g fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"><path d="M267 122H355"/><path d="M602 122H690"/><path d="M692 184H603"/><path d="M357 184H268"/></g></svg>
